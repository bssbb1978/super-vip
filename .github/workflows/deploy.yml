name: Build, Obfuscate & Deploy

# ──────────────────────────────────────────────────────────────────────────
# What changed vs. the old workflow, and why:
#
# 1. The old job obfuscated "index.js", which doesn't exist in this repo
#    (the entry point is worker.js). Fixed.
# 2. The old job committed the obfuscated file back to `main` while also
#    triggering on `**/*.js` pushes — that's a direct infinite-loop: every
#    bot commit re-triggers itself. Fixed by never committing build output
#    back to the repo; the obfuscated bundle is produced, tested, uploaded
#    as a run artifact, and deployed straight from the job — nothing is lost,
#    it just isn't round-tripped through git.
# 3. The old job ran `git push` on `pull_request` too, which fails for any
#    PR from a fork (no write token) and would also push to an arbitrary
#    PR head. Deploy now only runs on `push` to main / manual dispatch;
#    pull requests only get build + test, so a PR can't accidentally deploy.
# 4. There was no actual "deploy" step anywhere — only obfuscate + commit.
#    Added a real `wrangler deploy` stage wired to GitHub Actions secrets
#    and variables, plus idempotent D1/KV provisioning and a secret sync
#    step, so a push to main can go from source to a live Worker.
# 5. Obfuscation is upgraded from the "gentle" preset to a stronger one,
#    but two aggressive javascript-obfuscator features are deliberately
#    kept OFF: `self-defending` and `debug-protection`. Both inject
#    integrity/anti-debugging loops that assume a browser devtools context;
#    in the Workers isolate they are known to throw on invocation ("Code
#    generation from strings disallowed" / disallowed global-scope timers)
#    or simply deadlock. Turning them on would look "stronger" but would
#    break the deploy. Everything else is turned up. `--reserved-names`
#    pins the two identifiers external bindings depend on by literal string
#    (`QVRelay`, the Durable Object class name wrangler.toml binds to, and
#    `__QV_HANDLER`), so renaming never breaks the binding.
#
# 6. The obfuscation step is now scripts/build-bundle.mjs, which keeps every
#    flag above byte-for-byte and adds: a pinned build-provenance constant
#    (the reason tests/boot.test.mjs used to fail on the obfuscated artifact —
#    the `46-selfcheck.js` marker lived only in a comment, and comments are
#    stripped), a force-transformed canary that proves the string pipeline
#    really ran, seeded retries around a javascript-obfuscator 4.2.2 bug that
#    sometimes emits an unparseable class body, and dist/worker.meta.json —
#    a sha256 + identity + verification attestation that the deploy job
#    re-checks before anything reaches Cloudflare.
#
# 7. All six action usages are bumped from `@v4` to the newest releases and
#    pinned by full commit SHA (supply-chain-safe; `# vX.Y.Z` keeps them
#    readable).  `@v4` ran on Node.js 20, which GitHub now annotates as
#    deprecated; the pinned releases all declare `runs.using: node24`, so the
#    annotation is gone at the source instead of being silenced.  NOTE:
#    upload-artifact only became node24 at v6 and download-artifact at v7 —
#    v5/v6 of those two still declare node20 and would keep the warning.
#    A weekly Dependabot config (.github/dependabot.yml) now keeps both the
#    actions and the work/ toolchain current, so the next deprecation arrives
#    as a reviewed PR instead of a surprise annotation.
#
# Honesty note (matches the project's own house style of calling out
# assumptions): "fully automatic, never errors" isn't a real guarantee for
# a pipeline that talks to an external API (Cloudflare) over the network —
# tokens expire, rate limits happen, accounts hit plan limits. What this
# workflow *does* guarantee is that it fails loudly with a specific message
# instead of silently deploying something broken, and that nothing deploys
# unless the obfuscated bundle both parses and passes the existing test
# suite against a real miniflare-emulated Worker.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'work/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Target environment'
        type: choice
        options: [production, staging]
        default: production
      provision:
        description: 'Create the D1 database / KV namespace if missing (safe to leave off once set up)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Every action below is pinned to a release whose action.yml declares
  # `runs.using: node24`, so this is no longer needed to silence the
  # "Node.js 20 is deprecated … forced to run on Node.js 24" annotation —
  # it is kept as a belt-and-braces net so a future action that still ships
  # on node20 can never resurrect the warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── build + obfuscate + test — runs on every push and every PR ──────────
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 → runs.using: node24

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 → runs.using: node24
        with:
          node-version: '22'

      - name: Install javascript-obfuscator
        # acorn powers the build script's AST export-surface parity gate:
        # without it that one check is skipped, with it the artifact must
        # export exactly what worker.js exports.
        run: npm install --no-save --no-audit --no-fund javascript-obfuscator@^4 acorn@^8

      - name: Embed build provenance + obfuscate (strong preset, Workers-safe)
        # This one step replaces the old "Embed build metadata" + "Obfuscate"
        # pair.  It runs scripts/build-bundle.mjs, which keeps the *entire*
        # transformation stack byte for byte (every flag below is still
        # applied — see OBFUSCATION_FLAGS in the script) and adds what the
        # inline command could not do:
        #
        #   * the build identity (every core part + every unit + git sha +
        #     source and flag digests) is emitted as a real constant BEFORE
        #     obfuscation and pinned with --reserved-strings, because the
        #     previous pipeline only carried `46-selfcheck.js` inside a
        #     banner comment — comments are stripped, so
        #     tests/boot.test.mjs "the built artifact carries the full core
        #     and every unit" failed on any obfuscated build;
        #   * a force-transformed canary proves the string pipeline really
        #     ran (a silently no-op obfuscation fails the gate);
        #   * javascript-obfuscator 4.2.2 is nondeterministic on an input
        #     this size and occasionally emits a class body no engine can
        #     parse, so the script retries with another seed until the
        #     artifact verifies (seeds are deterministic — the winning seed
        #     is recorded and reused, making the build reproducible);
        #   * dist/worker.meta.json records sha256, the seed, the flags and
        #     the full verification report;
        #   * only if an *identity* check fails does it fall back to an
        #     inert provenance trailer comment.  Obfuscation is never
        #     relaxed and an artifact that does not verify is never written.
        run: node scripts/build-bundle.mjs

      - name: Verify the build attestation (independent re-check)
        # Re-reads dist/worker.meta.json, recomputes the artifact digest and
        # re-runs the parse + identity checks.  Fails the job if the bytes on
        # disk are not the bytes that were verified.
        run: node scripts/build-bundle.mjs --verify-only

      - name: Validate the obfuscated bundle actually parses as a module
        run: |
          set -euo pipefail
          cp dist/worker.js /tmp/worker.check.mjs
          node --check /tmp/worker.check.mjs
          echo "Bundle size: $(du -h dist/worker.js | cut -f1)"

      - name: Run the existing test suite against the obfuscated bundle
        # This is the real safety gate: if obfuscation subtly broke a code
        # path (the Durable Object export, Shadowsocks framing, DNS, etc.)
        # the suite boots the *obfuscated* file in a real miniflare
        # (D1 + KV) isolate, exactly like tests/helpers.mjs already does for
        # the plain build — so a break here fails the job before deploy ever
        # runs, instead of failing silently in production.
        #
        # The bundle is copied INSIDE work/ first: workerd rejects a module
        # path that climbs out of the working directory ("can't use '..' to
        # break out of starting directory"), which is what happened when
        # QV_SCRIPT pointed at <repo>/dist/worker.js while cwd was <repo>/work.
        # tests/helpers.mjs now also sets modulesRoot, so either layout works.
        working-directory: work
        env:
          QV_SCRIPT: ${{ github.workspace }}/work/dist/worker.js
        run: |
          set -euo pipefail
          mkdir -p dist
          cp ../dist/worker.js dist/worker.js
          cp ../dist/worker.meta.json dist/worker.meta.json
          npm ci --no-audit --no-fund
          npx vitest run

      - name: Upload obfuscated bundle + attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 → runs.using: node24
        with:
          name: worker-obfuscated-${{ github.sha }}
          path: |
            dist/worker.js
            dist/worker.meta.json
          retention-days: 30

  # ── deploy — only on push to main or manual dispatch, never on a PR ─────
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ github.event.inputs.deploy_env || 'production' }}
    env:
      DEPLOY_ENV: ${{ github.event.inputs.deploy_env || 'production' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 → runs.using: node24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 → runs.using: node24
        with:
          name: worker-obfuscated-${{ github.sha }}
          path: dist

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 → runs.using: node24
        with:
          node-version: '22'

      - name: Check required Cloudflare credentials are present
        run: |
          set -euo pipefail
          miss=()
          [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && miss+=("CLOUDFLARE_API_TOKEN")
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && miss+=("CLOUDFLARE_ACCOUNT_ID")
          if [ "${#miss[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${miss[*]}. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Verify the artifact that is about to be deployed
        # The attestation travels with the bundle; this re-check proves the
        # bytes wrangler is about to upload are exactly the bytes the test
        # suite passed against (sha256 + parse + identity).
        run: node scripts/build-bundle.mjs --verify-only --meta dist/worker.meta.json --out dist/worker.js

      - name: Install wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@^4

      - name: Apply non-secret configuration from repository variables
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          HOSTS: ${{ vars.HOSTS }}
          DEFAULT_QUOTA_GB: ${{ vars.DEFAULT_QUOTA_GB }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
        run: bash scripts/patch-wrangler-vars.sh

      - name: Provision D1 database + KV namespace (idempotent)
        if: ${{ github.event.inputs.provision == 'true' }}
        run: bash scripts/provision.sh

      - name: Sync secrets to the Worker
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_SECRET_TOKEN: ${{ secrets.API_SECRET_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          SS_MASTER_SECRET: ${{ secrets.SS_MASTER_SECRET }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          SS_PASSWORD: ${{ secrets.SS_PASSWORD }}
        run: bash scripts/push-secrets.sh

      - name: Deploy to Cloudflare Workers
        run: |
          set -euo pipefail
          FLAG=""
          [ "$DEPLOY_ENV" = "staging" ] && FLAG="--env staging"
          npx wrangler deploy dist/worker.js $FLAG

      - name: Post-deploy health check
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: bash scripts/health-check.sh
